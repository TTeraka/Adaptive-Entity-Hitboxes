plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

version = mod_version
group = mod_group

base {
    archivesName = archives_base_name
}

repositories {
    mavenCentral()

    maven {
        url = 'https://maven.fabricmc.net/'
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Runtime dependencies remain separate and are not bundled into this mod.
    modImplementation "maven.modrinth:BVzZfTc1:OVZ7HJXt" // ETF 7.2.5 for Fabric 1.21-1.21.1
    modImplementation "maven.modrinth:4I1XuqiY:VeoAKvQ0" // EMF 3.3.11 for Fabric 1.21-1.21.1
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

def patchVersion = project.version.toString()

tasks.named('processResources').configure {
    inputs.property "version", patchVersion

    filesMatching("fabric.mod.json") {
        expand "version": patchVersion
    }
}
