plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

version = mod_version
group = mod_group

base {
    archivesName = archives_base_name
}

repositories {
    mavenCentral()

    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

def patchVersion = project.version.toString()

tasks.named('processResources').configure {
    inputs.property "version", patchVersion

    filesMatching("fabric.mod.json") {
        expand "version": patchVersion
    }
}
